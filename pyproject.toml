[project]
name = "multi-format-etl"
version = "0.1.0"
description = "ETL/ELT com dados estruturados e não estruturados (CSV, JSON, XML, logs): loaders + padronização mínima, base para Silver/Gold."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
