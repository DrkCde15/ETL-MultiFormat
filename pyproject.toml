[project]
name = "multi-format-etl"
version = "0.3.0"
description = "ETL/ELT com dados estruturados e não estruturados (CSV, JSON, XML, logs): pipeline com gold, data quality e serving opcional em Postgres."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "kaggle>=2.2",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "matplotlib>=3.8",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
